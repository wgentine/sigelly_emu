services:
  sigelly-emu:
    image: ghcr.io/wgentine/sigelly_emu:${SIGELLY_TAG:-latest}
    # Local rebuild instead of GHCR: comment out `image:` and uncomment:
    # build: .
    container_name: sigelly-emu
    # Host networking is required for mDNS multicast and Shelly-like port 80.
    network_mode: host
    env_file: .env
    volumes:
      - sigelly-data:/data
    restart: unless-stopped

volumes:
  sigelly-data:
